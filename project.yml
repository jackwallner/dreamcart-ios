name: DreamCart
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.72.0"

schemes:
  DreamCart:
    build:
      targets:
        DreamCart: all
    run:
      config: Debug
      storeKitConfiguration: DreamCart.storekit
    test:
      config: Debug
      targets:
        - DreamCartTests

targets:
  DreamCart:
    type: application
    platform: iOS
    sources:
      - path: DreamCart
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.shop
        INFOPLIST_FILE: DreamCart/Info.plist
        CODE_SIGN_ENTITLEMENTS: DreamCart/DreamCart.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HAS_REVENUECAT"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  DreamCartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DreamCartTests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.shop.tests
    dependencies:
      - target: DreamCart
