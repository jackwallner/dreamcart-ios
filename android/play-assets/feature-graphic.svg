<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0 -10C1 -3 3 -1 10 0C3 1 1 3 0 10C-1 3 -3 1 -10 0C-3 -1 -1 -3 0 -10Z"/>
    </symbol>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3b0f7a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background: the icon's violet, flat, with a warm coral band from its lower corner -->
  <rect width="1024" height="500" fill="#7c3aed"/>
  <rect x="0" y="452" width="1024" height="48" fill="#ff8a65"/>
  <rect x="0" y="440" width="1024" height="12" fill="#ff3d8b"/>

  <!-- Scattered sparkles, as on the icon's bag -->
  <g fill="#ffffff" opacity="0.18">
    <use href="#spark" x="40" y="40" width="28" height="28"/>
    <use href="#spark" x="352" y="62" width="18" height="18"/>
    <use href="#spark" x="940" y="54" width="34" height="34"/>
    <use href="#spark" x="880" y="360" width="20" height="20"/>
    <use href="#spark" x="66" y="370" width="22" height="22"/>
  </g>

  <!-- The app icon's bag, drawn as vectors -->
  <g transform="translate(96 74)" filter="url(#shadow)">
    <path d="M78 66V56C78 22 102 0 134 0C166 0 190 22 190 56V66" fill="none" stroke="#ffffff" stroke-width="26"/>
    <rect x="0" y="60" width="268" height="268" rx="40" fill="#ffffff"/>
    <use href="#spark" x="44" y="148" width="78" height="78" fill="#f5b301"/>
    <use href="#spark" x="140" y="118" width="50" height="50" fill="#ff3d8b"/>
    <use href="#spark" x="112" y="226" width="40" height="40" fill="#7c3aed"/>
  </g>

  <!-- Name and one line -->
  <g fill="#ffffff">
    <text x="436" y="208" font-family="'Noto Serif', Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-1">DreamCart</text>
    <text x="440" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffd9ec">Dopamine Shopping</text>
    <rect x="442" y="292" width="72" height="5" rx="2.5" fill="#f5b301"/>
    <text x="440" y="350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#efe6ff">Fill your cart. Check out with coins.</text>
    <text x="440" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#efe6ff">Keep every piece in your closet.</text>
  </g>
</svg>
